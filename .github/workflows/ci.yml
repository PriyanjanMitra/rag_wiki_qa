name: CI

on:
  push:
    branches: [master, feature/dspy-rag]
  pull_request:
    branches: [master, feature/dspy-rag]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Python syntax
      run: python -m py_compile config.py
      continue-on-error: true

  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci
      working-directory: frontend

    - name: TypeScript check
      run: npx tsc --noEmit
      working-directory: frontend
      continue-on-error: true

    - name: Build
      run: npm run build
      working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Lowercase repo name
      run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate backend tags
      run: |
        TAG="${{ github.ref_name }}"
        TAG="${TAG//\//-}"
        if [ "$TAG" = "master" ]; then
          echo "BACKEND_TAGS=ghcr.io/${{ env.REPO }}-backend:latest,ghcr.io/${{ env.REPO }}-backend:master" >> $GITHUB_ENV
        else
          echo "BACKEND_TAGS=ghcr.io/${{ env.REPO }}-backend:${TAG}" >> $GITHUB_ENV
        fi

    - name: Generate frontend tags
      run: |
        TAG="${{ github.ref_name }}"
        TAG="${TAG//\//-}"
        if [ "$TAG" = "master" ]; then
          echo "FRONTEND_TAGS=ghcr.io/${{ env.REPO }}-frontend:latest,ghcr.io/${{ env.REPO }}-frontend:master" >> $GITHUB_ENV
        else
          echo "FRONTEND_TAGS=ghcr.io/${{ env.REPO }}-frontend:${TAG}" >> $GITHUB_ENV
        fi

    - name: Build and push backend image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.backend
        push: true
        tags: ${{ env.BACKEND_TAGS }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.frontend
        push: true
        tags: ${{ env.FRONTEND_TAGS }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
