apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-clickhouse
  template:
    metadata:
      labels:
        app: langfuse-clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:24.12-alpine
        ports:
        - containerPort: 8123
          name: http
        - containerPort: 9000
          name: native
        volumeMounts:
        - name: data
          mountPath: /var/lib/clickhouse
        - name: user-config
          mountPath: /etc/clickhouse-server/users.d
        - name: cluster-config
          mountPath: /etc/clickhouse-server/config.d
      volumes:
      - name: data
        emptyDir: {}
      - name: user-config
        configMap:
          name: clickhouse-user-config
      - name: cluster-config
        configMap:
          name: clickhouse-cluster-config
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
spec:
  selector:
    app: langfuse-clickhouse
  ports:
  - name: http
    port: 8123
  - name: native
    port: 9000
