apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse
spec:
  ingressClassName: nginx
  rules:
  - host: langfuse.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: langfuse
            port:
              number: 3000
