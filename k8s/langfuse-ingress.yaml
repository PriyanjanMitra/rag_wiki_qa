apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /langfuse(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: langfuse
            port:
              number: 3000
