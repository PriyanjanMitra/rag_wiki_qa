apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: rag_wiki_qa_backend
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: OLLAMA_URL
          value: "http://ollama:11434"
        volumeMounts:
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: index-data
          mountPath: /app/index
      volumes:
      - name: hf-cache
        hostPath:
          path: /tmp/huggingface
          type: DirectoryOrCreate
      - name: index-data
        persistentVolumeClaim:
          claimName: rag-index
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - port: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-index
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
