apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-wiki-qa
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /ask
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /health
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /upload
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /uploads
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 4173
